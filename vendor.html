<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPIG Vendor Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<style>
:root{--navy:#1256A4;--blue:#1256A4;--blue2:#1E7ED4;--bg:#f4f7fa;--card:#fff;--line:#dbe3ea;--text:#1c2733;--muted:#677685;--green:#2f7d32;--amber:#9a6700;--red:#b42318;--purple:#6941c6;--ltblue:#eaf2f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Segoe UI,sans-serif;font-size:14px}button,input,select,textarea{font:inherit}
.topbar{height:60px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 18px;position:sticky;top:0;z-index:50;box-shadow:0 2px 7px rgba(0,0,0,.12)}
.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px}.brand small{font-weight:500;opacity:.8;margin-left:3px}.topbar-logo{height:44px;display:flex;align-items:center}.topbar-logo img{height:44px;width:auto;object-fit:contain;filter:brightness(0) invert(1)}.spacer{flex:1}
.btn{border:1px solid #cfd8e1;background:#fff;color:#253342;border-radius:7px;padding:8px 11px;font-weight:700;cursor:pointer;text-decoration:none}.btn:hover{background:#f7f9fb}.btn.primary{background:var(--blue2);border-color:var(--blue2);color:#fff}.btn.sm{padding:5px 8px;font-size:12px}.btn.danger{color:var(--red)}
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 58px)}
.sidebar{background:#fff;border-right:1px solid var(--line);position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto;padding:12px 10px}.navgroup{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#8a97a3;padding:10px 9px 5px;font-weight:700}.navitem{padding:9px 10px;border-radius:7px;cursor:pointer;font-weight:700;color:#41515f;margin:2px 0;display:flex;justify-content:space-between;gap:8px}.navitem:hover{background:#f1f5f9}.navitem.on{background:#e7f0f8;color:#123f69}.navcount{font-size:10px;color:#788896}
.location-search{width:100%;border:1px solid #cfd8e1;border-radius:7px;padding:8px;margin:5px 0 7px}.loclist{max-height:calc(100vh - 325px);overflow:auto}.loc{padding:8px 9px;border-radius:7px;cursor:pointer;margin:2px 0;border:1px solid transparent}.loc:hover{background:#f2f6f9}.loc.on{background:#e7f0f8;border-color:#bfd4e7;color:#123f69;font-weight:700}.loc small{display:block;color:var(--muted);font-weight:400;margin-top:2px}
.content{padding:18px 20px 40px;min-width:0;max-width:1700px;width:100%;margin:0 auto}.page{display:none}.page.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 1px 3px rgba(16,24,40,.07)}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:14px}.pagehead h1{margin:0;font-size:24px}.subtitle{color:var(--muted);margin-top:4px}.address{font-size:13px;color:#4f6070;margin-top:5px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:10px;margin:0 0 14px}.kpi{padding:12px}.kpi .label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}.kpi .value{font-size:24px;font-weight:700;margin-top:4px}.kpi .note{font-size:11px;color:var(--muted);margin-top:2px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:11px;margin-bottom:12px}.input,.select{border:1px solid #cfd8e1;background:#fff;border-radius:7px;padding:8px 9px;min-height:36px}.input{min-width:250px}.grow{flex:1}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;background:#fff}th{background:#f3f6f9;color:#5f6f7c;text-transform:uppercase;letter-spacing:.045em;font-size:10px;text-align:left;padding:9px;position:sticky;top:0;white-space:nowrap}td{padding:10px 9px;border-top:1px solid #edf1f4;vertical-align:top}tr:hover td{background:#fbfcfd}.sortable{cursor:pointer}.sortable:hover{background:#e8eef4}
.catname{font-weight:700;min-width:190px}.vendorname{font-weight:700;font-size:14px}.rank{display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;border-radius:50%;background:#17365d;color:#fff;font-size:11px;font-weight:700;margin-right:7px}.alt{margin-top:7px;padding-top:7px;border-top:1px dashed #e1e7ec;font-size:12px}.altrow{margin:4px 0;color:#465563}.source{font-size:11px;color:var(--muted);margin-top:3px}.note{font-size:12px;color:#465563;margin-top:5px;line-height:1.35}.note.important{background:#fff7df;border-left:3px solid #d99b00;padding:7px 8px;border-radius:4px;color:#53420b}
.tag{display:inline-block;border-radius:999px;padding:3px 7px;font-size:10.5px;font-weight:700;white-space:nowrap}.current{background:#eaf4e6;color:var(--green)}.historical{background:#edf0f3;color:#58636e}.legacy{background:#fff4d6;color:var(--amber)}.recommended{background:#f0eafa;color:var(--purple)}.used{background:#e8f1fb;color:#245f92}.notused{background:#feeceb;color:var(--red)}.missing{background:#fff4d6;color:#8a5b00}
.emptycat{color:#8a5b00;font-weight:700}.authority{font-size:10px;background:#e8f1fb;color:#245f92;padding:2px 6px;border-radius:4px;display:inline-block;margin-top:4px}.contact{font-size:12px;line-height:1.4}.nowrap{white-space:nowrap}
.coverage{height:7px;background:#edf1f4;border-radius:999px;overflow:hidden;margin-top:6px;min-width:120px}.coverage i{display:block;height:100%;background:#2e75b6}
.callout{padding:11px 13px;border-left:4px solid var(--blue2);background:#eaf2f8;border-radius:6px;margin-bottom:12px}.callout.amber{border-color:#d99b00;background:#fff7df}.empty{padding:28px;text-align:center;color:var(--muted)}
#loading{margin:20px;padding:38px;text-align:center;color:var(--muted)}
.modalback{display:none;position:fixed;inset:0;background:rgba(14,25,38,.5);z-index:100;align-items:flex-start;justify-content:center;padding:70px 20px 30px}.modalback.show{display:flex}.modal{background:#fff;width:min(760px,96vw);max-height:calc(100vh - 100px);overflow:auto;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.modalhead{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:13px 15px;display:flex;justify-content:space-between;align-items:center;z-index:2}.modalbody{padding:15px}.close{font-size:22px;cursor:pointer}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:11px;text-transform:uppercase;color:#697987;font-weight:700}.field input,.field select,.field textarea{border:1px solid #cfd8e1;border-radius:7px;padding:8px}.field.full{grid-column:1/-1}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
@media(max-width:1000px){.shell{grid-template-columns:1fr}.sidebar{position:static;height:auto}.loclist{max-height:220px}.kpis{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}}

.commercialtag{display:inline-block;background:#e7f6ec;color:#21733d;border-radius:999px;padding:2px 6px;font-size:10px;font-weight:700;margin:3px 4px 0 0}
.reviewtag{display:inline-block;background:#eef2ff;color:#3b4c9b;border-radius:999px;padding:2px 6px;font-size:10px;font-weight:700;margin:3px 4px 0 0}
.weblink{font-size:11px;font-weight:700;color:#1256A4;text-decoration:none}.weblink:hover{text-decoration:underline}
.catalogcards{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:10px}
.catalogcard{padding:13px}.catalogcard h3{margin:0 0 5px;font-size:15px}.catalogmeta{font-size:11px;color:var(--muted);line-height:1.4;margin-top:5px}
@media(max-width:1100px){.catalogcards{grid-template-columns:1fr 1fr}}@media(max-width:760px){.catalogcards{grid-template-columns:1fr}}

</style>
</head>

function showView(v,el){currentView=v;document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById('view-'+v).classList.add('active');document.querySelectorAll('.navitem[data-view]').forEach(x=>x.classList.remove('on'));(el||document.querySelector(`.navitem[data-view="${v}"]`))?.classList.add('on');renderCurrentView();}
function selectLocation(key){selectedLocationKey=key;showView('locations');renderLocationList();renderLocationView();}
function renderLocationList(){const q=norm(document.getElementById('locationSearch')?.value||'');let locs=activeLocations();if(q)locs=locs.filter(l=>norm([l.name,l.num,l.state,l.city].join(' ')).includes(q));document.getElementById('locationList').innerHTML=locs.map(l=>`<div class="loc ${selectedLocationKey===l.key?'on':''}" onclick='selectLocation(${JSON.stringify(l.key)})'>${esc(l.name)}<small>${esc(l.num)}${l.state?' • '+esc(l.state):''}</small></div>`).join('')||'<div class="empty" style="padding:12px">No locations found.</div>';}
function currentLoc(){const locs=activeLocations();return locs.find(l=>l.key===selectedLocationKey)||locs[0]||null;}
function renderCurrentView(){if(currentView==='locations')renderLocationView();if(currentView==='vendors')renderVendorsView();if(currentView==='categories')renderCategoriesView();if(currentView==='catalog')renderCatalogView();if(currentView==='research')renderResearchView();if(currentView==='notes')renderNotesView();}
function vendorStatus(a){if(!a)return '<span class="tag missing">Needs Research</span>';return String(a['Assignment Status'])==='Recommended'?usedBadge('No'):badge(a['Assignment Status']||'Historical');}
function renderNotesBlock(ns){if(!ns.length)return '<span class="source">No special notes.</span>';return ns.slice(0,3).map(n=>`<div class="note ${/hvac|lease|responsib|cap|landlord/i.test(n.type+' '+n.text)?'important':''}"><b>${esc(n.type)}:</b> ${esc(n.text)}${n.source?`<div class="source">${esc(n.source)}</div>`:''}</div>`).join('');}
function renderLocationView(){const loc=currentLoc();if(!loc){document.getElementById('locationView').innerHTML='<div class="empty">No active Lease Manager locations were found.</div>';return;}selectedLocationKey=loc.key;renderLocationList();let rows=(MATRIX_BY_LOC.get(loc.key)||[]).slice();const q=norm(document.getElementById('locVendorSearch')?.value||'');const sf=document.getElementById('locStatusFilter')?.value||'';if(q)rows=rows.filter(x=>norm([x.category,...x.vendors.map(v=>v['Vendor Name']),...x.notes.map(n=>n.text)].join(' ')).includes(q));if(sf==='used')rows=rows.filter(x=>x.primary&&String(x.primary['Used by Service Pros']).toLowerCase()==='yes');if(sf==='recommended')rows=rows.filter(x=>x.primary&&x.primary['Assignment Status']==='Recommended');if(sf==='missing')rows=rows.filter(x=>actionableGap(x));if(sortMode==='missing')rows.sort((a,b)=>(a.primary?1:0)-(b.primary?1:0)||a.category.localeCompare(b.category));else rows.sort((a,b)=>CAT_ORDER.indexOf(a.category)-CAT_ORDER.indexOf(b.category));const all=MATRIX_BY_LOC.get(loc.key)||[],used=all.filter(x=>x.primary&&String(x.primary['Used by Service Pros']).toLowerCase()==='yes').length,recs=all.filter(x=>x.primary&&x.primary['Assignment Status']==='Recommended').length,miss=all.filter(actionableGap).length,nc=all.reduce((s,x)=>s+x.notes.length,0);
 document.getElementById('locationView').innerHTML=`<div class="pagehead"><div><h1>${esc(loc.name)}${loc.num?` <span class="source">WR ${esc(loc.num)}</span>`:''}</h1><div class="address">${esc([loc.address,loc.city,loc.state,loc.zip].filter(Boolean).join(', '))}</div><div class="subtitle">Every vendor category is shown. Service Pros vendors stay ahead of recommendations. Roof is landlord-first; Pad Racking is Tier Rack; empty commercial categories receive researched options.</div></div><button class="btn" onclick="showView('catalog')">Research Catalog</button></div>
 <div class="kpis"><div class="card kpi"><div class="label">Categories</div><div class="value">${all.length}</div><div class="note">Always shown</div></div><div class="card kpi"><div class="label">Used / Known</div><div class="value">${used}</div><div class="note">Service Pros relationship</div></div><div class="card kpi"><div class="label">Recommendations</div><div class="value">${recs}</div><div class="note">Not yet used</div></div><div class="card kpi"><div class="label">Needs Research</div><div class="value">${miss}</div><div class="note">No vendor identified</div></div></div>
 <div class="card toolbar"><input id="locVendorSearch" class="input" placeholder="Search category, vendor, note..." value="${esc(document.getElementById('locVendorSearch')?.value||'')}" oninput="renderLocationView()"><select id="locStatusFilter" class="select" onchange="renderLocationView()"><option value="">All category statuses</option><option value="used">Used / Known</option><option value="recommended">Recommendations</option><option value="missing">Needs Research</option></select><div class="grow"></div><button class="btn sm" onclick="sortMode=sortMode==='missing'?'category':'missing';renderLocationView()">${sortMode==='missing'?'Category order':'Missing first'}</button></div>
 <div class="card tablewrap"><table><thead><tr><th>Category</th><th>#1 Vendor</th><th>Status</th><th>Contact</th><th>Notes / Rules</th><th>Other Vendors</th><th></th></tr></thead><tbody>${rows.map(x=>renderCategoryRow(x)).join('')}</tbody></table></div>`;
 // restore selected filter after replacing DOM
 const f=document.getElementById('locStatusFilter');if(f)f.value=sf;
}
function renderCategoryRow(x){
 const a=x.primary;
 if(!a){
   const info=x.category==="Utilities"?"Location-specific utility relationship — verify current account/provider.":x.category==="Other / Specialty"?"Kept on-demand; add a specialty vendor when a real need occurs.":`Research needed for ${x.loc.name}.`;
   return `<tr><td class="catname">${esc(x.category)}</td><td><span class="emptycat">No vendor identified</span><div class="source">${esc(info)}</div></td><td><span class="tag missing">${["Utilities","Other / Specialty"].includes(x.category)?"Source Specific":"Needs Research"}</span></td><td>—</td><td>${renderNotesBlock(x.notes)}</td><td>—</td><td><button class="btn sm" onclick='openAdd(${JSON.stringify(x.loc.key)},${JSON.stringify(x.category)})'>Add vendor</button></td></tr>`;
 }
 const ev=evidenceFor(a,x.loc),last=[a["Last Used Date"],ev?.lastUsed].filter(Boolean).sort().pop();
 const website=a.Website||"";
 const contact=[a["Contact Name"],a.Phone,a.Email].filter(Boolean).map(esc).join("<br>")||'<span class="source">No direct contact loaded</span>';
 const ns=notesFor(x.loc,x.category,a["Vendor Name"]),alts=x.vendors.slice(1,5);
 const researchMeta=a._research?`<div><span class="commercialtag">Commercial verified</span><span class="reviewtag">Reviews considered</span></div><div class="source">${esc(a._coverage||"")}</div><div class="source">${esc(a._reviewNote||"")}</div>`:"";
 const web=website?`<div style="margin-top:4px"><a class="weblink" href="${esc(website)}" target="_blank" rel="noopener">Website ↗</a></div>`:"";
 const status=a["Assignment Status"]==="Recommended"?`${badge("Recommended")}<div style="margin-top:4px">${usedBadge("No")}</div>`:`${badge(a["Assignment Status"]||"Current")}<div style="margin-top:4px">${String(a["Used by Service Pros"]).toLowerCase()==="yes"?'<span class="tag used">Used by SP</span>':""}</div>`;
 return `<tr><td class="catname">${esc(x.category)}</td><td><div><span class="rank">1</span><span class="vendorname">${esc(a["Vendor Name"])}</span></div>${a.Relationship?`<div class="source">${esc(a.Relationship)}</div>`:""}${last?`<div class="source">Last evidence: <b>${esc(String(last).slice(0,10))}</b>${ev?.count?` • ${ev.count} NetSuite memo match${ev.count===1?"":"es"}`:""}</div>`:""}${a._authority?`<span class="authority">${esc(a["Source Type"]||"Source")} authoritative</span>`:""}${researchMeta}${web}</td><td>${status}</td><td class="contact">${contact}</td><td>${renderNotesBlock(ns.length?ns:x.notes)}${a["Assignment Notes"]&&!ns.some(n=>norm(n.text)===norm(a["Assignment Notes"]))?`<div class="note">${esc(a["Assignment Notes"])}</div>`:""}</td><td>${alts.length?alts.map((b,i)=>`<div class="altrow"><b>#${i+2} ${esc(b["Vendor Name"])}</b> ${b["Assignment Status"]==="Recommended"?'<span class="tag recommended">Recommendation</span>':""}${b._commercialVerified?'<span class="commercialtag">Commercial</span>':""}${b.Website?`<div><a class="weblink" href="${esc(b.Website)}" target="_blank" rel="noopener">Website ↗</a></div>`:""}${b["Last Used Date"]?`<div class="source">Last used: ${esc(String(b["Last Used Date"]).slice(0,10))}</div>`:""}${b._reviewNote?`<div class="source">${esc(b._reviewNote)}</div>`:""}</div>`).join(""):'<span class="source">None</span>'}</td><td>${a._sourceLock?`<button class="btn sm" title="Source-controlled or researched recommendation">Source<br>controlled</button>`:`<button class="btn sm" onclick="openEdit(${a.Id})">Edit</button>`}</td></tr>`;
}
function renderVendorsView(){const q=norm(document.getElementById('vendorSearch')?.value||'');const map=new Map();for(const m of vendors)map.set(norm(m.Title),{name:m.Title,master:m,locs:new Set(),cats:new Set(),used:0,recs:0});for(const loc of activeLocations())for(const a of allAssignmentsForLoc(loc)){const k=norm(a['Vendor Name']);if(!k)continue;if(!map.has(k))map.set(k,{name:a['Vendor Name'],master:null,locs:new Set(),cats:new Set(),used:0,recs:0});const v=map.get(k);v.locs.add(loc.name);v.cats.add(a.Category);if(String(a['Used by Service Pros']).toLowerCase()==='yes')v.used++;if(a['Assignment Status']==='Recommended')v.recs++;}let arr=[...map.values()].filter(v=>!q||norm([v.name,...v.locs,...v.cats].join(' ')).includes(q)).sort((a,b)=>a.name.localeCompare(b.name));document.getElementById('vendorsView').innerHTML=`<div class="pagehead"><div><h1>All Vendors</h1><div class="subtitle">Master vendor directory with active-location/category usage.</div></div></div><div class="card toolbar"><input id="vendorSearch" class="input" placeholder="Search vendor, location, category..." oninput="renderVendorsView()"></div><div class="card tablewrap"><table><thead><tr><th>Vendor</th><th>Locations</th><th>Categories</th><th>Relationship</th></tr></thead><tbody>${arr.map(v=>`<tr><td class="vendorname">${esc(v.name)}</td><td>${v.locs.size}<div class="source">${esc([...v.locs].slice(0,5).join(', '))}${v.locs.size>5?'…':''}</div></td><td>${esc([...v.cats].join(', '))}</td><td>${v.used?'<span class="tag used">Used by SP</span>':''} ${v.recs?'<span class="tag recommended">Recommendation</span>':''}</td></tr>`).join('')}</tbody></table></div>`;}
function renderCategoriesView(){const locCount=activeLocations().length;const cats=effectiveCategories();const rows=cats.map(c=>{const m=matrix.filter(x=>x.category===c);const covered=m.filter(x=>x.primary).length,used=m.filter(x=>x.primary&&String(x.primary['Used by Service Pros']).toLowerCase()==='yes').length,recs=m.filter(x=>x.primary&&x.primary['Assignment Status']==='Recommended').length;return{c,covered,used,recs,miss:m.length-covered,pct:m.length?Math.round(covered/m.length*100):0};}).sort((a,b)=>a.c.localeCompare(b.c));document.getElementById('categoriesView').innerHTML=`<div class="pagehead"><div><h1>Categories</h1><div class="subtitle">Coverage across every active location.</div></div></div><div class="card tablewrap"><table><thead><tr><th>Category</th><th>Coverage</th><th>Used / Known</th><th>Recommendations</th><th>Needs Research</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="catname">${esc(r.c)}</td><td>${r.covered} / ${locCount} (${r.pct}%)<div class="coverage"><i style="width:${r.pct}%"></i></div></td><td>${r.used}</td><td>${r.recs}</td><td>${r.miss}</td></tr>`).join('')}</tbody></table></div>`;}
function researchCatalogRows(){
 const rows=[];for(const [cat,arr] of Object.entries(RESEARCH_CATALOG))for(const [i,v] of arr.entries())rows.push({category:cat,rank:i+1,...v});
 return rows;
}
function renderCatalogView(){
 const q=norm(document.getElementById("catalogSearch")?.value||"");
 let rows=researchCatalogRows();if(q)rows=rows.filter(r=>norm([r.category,r.name,r.coverage,r.service,r.review].join(" ")).includes(q));
 document.getElementById("catalogView").innerHTML=`<div class="pagehead"><div><h1>Research Catalog</h1><div class="subtitle">Commercial vendors researched as fallback options when Service Pros has no known vendor. These are recommendations only — never usage history.</div></div></div>
 <div class="callout amber"><b>How ranking works:</b> verified commercial capability and useful coverage come first; review signals are considered where reliable. For franchise/local-service networks, branch-level reviews can differ, so the app explicitly tells you to check the serving branch before the first dispatch.</div>
 <div class="card toolbar"><input id="catalogSearch" class="input" placeholder="Search company, category, service..." oninput="renderCatalogView()"><div class="grow"></div><span class="source">${rows.length} researched category options</span></div>
 <div class="catalogcards">${rows.map(r=>`<div class="card catalogcard"><div class="source">${esc(r.category)} • Recommended #${r.rank}</div><h3>${esc(r.name)}</h3><div><span class="commercialtag">Commercial verified</span><span class="reviewtag">Reviews considered</span></div><div class="catalogmeta"><b>Coverage:</b> ${esc(r.coverage)}<br><b>Service:</b> ${esc(r.service)}<br><b>Review note:</b> ${esc(r.review)}<br>${r.phone?`<b>Phone:</b> ${esc(r.phone)}<br>`:""}<a class="weblink" href="${esc(r.website)}" target="_blank" rel="noopener">Official website ↗</a></div></div>`).join("")}</div>`;
}
function renderResearchView(){const q=norm(document.getElementById('researchSearch')?.value||'');let gaps=matrix.filter(actionableGap);if(q)gaps=gaps.filter(x=>norm([x.loc.name,x.loc.state,x.category].join(' ')).includes(q));document.getElementById('researchView').innerHTML=`<div class="pagehead"><div><h1>Needs Research</h1><div class="subtitle">Remaining active location/category combinations with neither a Service Pros vendor nor a researched commercial fallback.</div></div></div><div class="callout amber"><b>${gaps.length} gaps shown.</b> The app now supplies researched commercial fallbacks for supported categories. This list is only the remaining exceptions that still need location-specific research.</div><div class="card toolbar"><input id="researchSearch" class="input" placeholder="Search location or category..." oninput="renderResearchView()"></div><div class="card tablewrap"><table><thead><tr><th>Location</th><th>Category</th><th>Action</th></tr></thead><tbody>${gaps.map(x=>`<tr><td><b>${esc(x.loc.name)}</b><div class="source">${esc(x.loc.state)} • WR ${esc(x.loc.num)}</div></td><td class="catname">${esc(x.category)}</td><td><button class="btn sm" onclick='openAdd(${JSON.stringify(x.loc.key)},${JSON.stringify(x.category)})'>Add vendor / recommendation</button></td></tr>`).join('')}</tbody></table></div>`;}
function allNoteRows(){return ALL_NOTES_CACHE;}
function renderNotesView(){const q=norm(document.getElementById('notesSearch')?.value||'');let arr=allNoteRows();if(q)arr=arr.filter(n=>norm([n.loc.name,n.cat,n.type,n.text,n.source].join(' ')).includes(q));document.getElementById('notesView').innerHTML=`<div class="pagehead"><div><h1>Notes / Rules</h1><div class="subtitle">Lease responsibilities, HVAC caps, dispatch instructions, and other retained vendor notes.</div></div></div><div class="card toolbar"><input id="notesSearch" class="input" placeholder="Search HVAC cap, landlord, location..." oninput="renderNotesView()"></div><div class="card tablewrap"><table><thead><tr><th>Location</th><th>Category</th><th>Type</th><th>Note</th><th>Source</th></tr></thead><tbody>${arr.map(n=>`<tr><td><b>${esc(n.loc.name)}</b></td><td>${esc(n.cat)}</td><td>${esc(n.type)}</td><td>${esc(n.text)}</td><td class="source">${esc(n.source)}</td></tr>`).join('')}</tbody></table></div>`;}
function closeModal(){document.getElementById('modalBack').classList.remove('show');}
function openEdit(id){const a=assignments.find(x=>x.Id===id);if(!a)return;document.getElementById('modalTitle').textContent='Edit Vendor Assignment';document.getElementById('modalSub').textContent=[a.Location,a.Category].filter(Boolean).join(' • ');document.getElementById('modalBody').innerHTML=assignmentForm(a,false);document.getElementById('modalBack').classList.add('show');}
function openAdd(locKey,cat){const loc=activeLocations().find(x=>x.key===locKey);if(!loc)return;const a={Location:loc.name,'Location Number':loc.num,Category:cat,'Assignment Status':'Recommended','Used by Service Pros':'No'};document.getElementById('modalTitle').textContent='Add Vendor / Recommendation';document.getElementById('modalSub').textContent=loc.name+' • '+cat;document.getElementById('modalBody').innerHTML=assignmentForm(a,true);document.getElementById('modalBack').classList.add('show');}
function assignmentForm(a,isNew){return `<div class="formgrid"><div class="field full"><label>Vendor Name</label><input id="eVendor" value="${esc(a['Vendor Name']||'')}"></div><div class="field"><label>Status</label><select id="eStatus"><option>Current</option><option>Historical</option><option>Legacy / Needs Verification</option><option>Recommended</option></select></div><div class="field"><label>Used by Service Pros</label><select id="eUsed"><option>Yes</option><option>No</option></select></div><div class="field"><label>Contact Name</label><input id="eContact" value="${esc(a['Contact Name']||'')}"></div><div class="field"><label>Phone</label><input id="ePhone" value="${esc(a.Phone||'')}"></div><div class="field full"><label>Email</label><input id="eEmail" value="${esc(a.Email||'')}"></div><div class="field"><label>Last Used Date</label><input id="eLast" type="date" value="${esc(String(a['Last Used Date']||'').slice(0,10))}"></div><div class="field"><label>Relationship</label><input id="eRelationship" value="${esc(a.Relationship||'')}"></div><div class="field full"><label>Assignment Notes</label><textarea id="eNotes" rows="4">${esc(a['Assignment Notes']||'')}</textarea></div></div><div class="modalactions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick='saveAssignment(${isNew?'null':a.Id},${JSON.stringify(a.Location)},${JSON.stringify(a['Location Number']||'')},${JSON.stringify(a.Category)})'>Save to SharePoint</button></div><script>document.getElementById('eStatus').value=${JSON.stringify(a['Assignment Status']||'Current')};document.getElementById('eUsed').value=${JSON.stringify(a['Used by Service Pros']||'Yes')};<\/script>`;}
async function listEntityType(list){const j=await sp(`${SP_SITE}/_api/web/lists/GetByTitle('${encodeURIComponent(list)}')?$select=ListItemEntityTypeFullName`);return j.d?.ListItemEntityTypeFullName||j.ListItemEntityTypeFullName;}
async function saveAssignment(id,location,locNum,category){try{const fm=await fieldMap('SPIG Vendor Assignments');const values={Title:`${location} | ${category} | ${document.getElementById('eVendor').value.trim()}`,'Vendor Name':document.getElementById('eVendor').value.trim(),'Location':location,'Location Number':locNum,'Category':category,'Assignment Status':document.getElementById('eStatus').value,'Used by Service Pros':document.getElementById('eUsed').value,'Contact Name':document.getElementById('eContact').value.trim(),'Phone':document.getElementById('ePhone').value.trim(),'Email':document.getElementById('eEmail').value.trim(),'Last Used Date':document.getElementById('eLast').value||null,'Relationship':document.getElementById('eRelationship').value.trim(),'Assignment Notes':document.getElementById('eNotes').value.trim()};const payload={};for(const [k,v] of Object.entries(values)){const ik=k==='Title'?'Title':fm[k];if(ik)payload[ik]=v;}if(id){await sp(`${SP_SITE}/_api/web/lists/GetByTitle('SPIG%20Vendor%20Assignments')/items(${id})`,{method:'POST',headers:{'Content-Type':'application/json;odata=verbose','X-HTTP-Method':'MERGE','IF-MATCH':'*'},body:JSON.stringify(payload)});}else{const type=await listEntityType('SPIG Vendor Assignments');payload.__metadata={type};await sp(`${SP_SITE}/_api/web/lists/GetByTitle('SPIG%20Vendor%20Assignments')/items`,{method:'POST',headers:{'Content-Type':'application/json;odata=verbose'},body:JSON.stringify(payload)});}closeModal();await reloadAll();}catch(e){alert('Could not save assignment: '+e.message);console.error(e);}}
function updateNavCounts(){document.getElementById('navLocCount').textContent=activeLocations().length;document.getElementById('navVendorCount').textContent=vendors.length;const nc=document.getElementById('navCatCount');if(nc)nc.textContent=effectiveCategories().length;const cc=document.getElementById('navCatalogCount');if(cc)cc.textContent=new Set(researchCatalogRows().map(x=>x.name)).size;document.getElementById('navResearchCount').textContent=matrix.filter(actionableGap).length;document.getElementById('navNotesCount').textContent=allNoteRows().length;}
async function reloadAll(){token=null;setLoading('Connecting to SharePoint…');document.getElementById('loading').style.display='';document.getElementById('app').style.display='none';try{setLoading('Loading Lease Manager and vendor lists…');const [l,a,v,n,c,f]=await Promise.all([getList('Lease Manager',['Location','LeaseStatus','Address','City','State','Zip','LocNum','Landlord','LandlordContact']),getList('SPIG Vendor Assignments',['Assignment ID','Vendor ID','Vendor Name','Location','Location Number','Category','Assignment Status','Relationship','Used by Service Pros','Source Type','Source Detail','Evidence Level','Assignment Notes','Needs Review','Contact Name','Phone','Email','Address','Service Scope','Last Used Date','NetSuite Evidence Count']),getList('SPIG Vendor Master',['Vendor ID','Vendor Status','Main Contact','Main Phone','Main Email','Website','Address','Coverage Type','Vendor Notes','Needs Review']),getList('SPIG Vendor Notes',['Note ID','Vendor ID','Vendor Name','Location','Category','Note Type','Note Text','Is Current','Source Type','Source Detail']),getList('SPIG Vendor Categories',[]),getList('Forklift Fleet',['Current Workroom','Status','Primary Service Vendor','Primary Service Vendor Phone'])]);leases=l;assignments=a;vendors=v;notes=n;categories=c;forklifts=f;setLoading('Indexing locations and vendors…');buildIndexes();buildMatrix();const locs=activeLocations();selectedLocationKey=locs[0]?.key||'';updateNavCounts();renderLocationList();renderCurrentView();document.getElementById('loading').style.display='none';document.getElementById('app').style.display='grid';}catch(e){setLoading(e.message||String(e),true);console.error(e);}}
window.addEventListener('load',async()=>{try{if(!window.msal)throw new Error('Microsoft authentication library did not load.');msalApp=new msal.PublicClientApplication(MSAL_CFG);await msalApp.handleRedirectPromise();await reloadAll();}catch(e){setLoading(e.message||String(e),true);console.error(e);}});
</script>
